# ~/.tmux.conf, linked from ~/source/dotfiles/tmux/tmux.conf

# Prefix stays Ctrl+B. Mouse selects panes, resizes them and scrolls.
set -g mouse on
set -g history-limit 100000

# Windows and panes count from 1 like the keyboard, with no gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Esc reaches vim and the shell at once.
set -sg escape-time 10
set -g focus-events on

# True colour and the terminal name iTerm2 expects.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Clipboard: copying in tmux lands in the macOS pasteboard (also over ssh).
set -g set-clipboard on

# Splits open in the current directory: prefix | and prefix -.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix r reloads this file.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf ricaricato"

# Copy mode with vi keys: v selects, y copies.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar: session on the left, host and time on the right.
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]#H  %H:%M "
setw -g window-status-current-style "fg=colour231,bold"
